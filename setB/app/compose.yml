services:
  api:
    image: https://hub.docker.com/repository/docker/maarak/mid-svc/general
    build: .
    ports:
      - "9010:5000"
    environment:
      - STUDENT=56410
      - REDIS-HOST=store
    networks:
      - backend: 56410
    depends_on:
      - store

  store:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - backend: 56410
    volumes:
      - store-56410:/data

networks:
  backend:  

volumes:
  store-56410: